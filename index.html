<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guess the City</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --paper:#eef3f8;--card:#fff;--ink:#14213d;--muted:#5b6780;--line:#d5deea;--red:#d62839;--blue:#1d4e89;--wa:#1faa59;--chip:#e3eaf3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0e1522;--card:#172136;--ink:#eef2f8;--muted:#9aa7bf;--line:#2a3752;--red:#ff5a67;--blue:#6aa3ff;--wa:#35c46f;--chip:#1f2c46}}
:root[data-theme="dark"]{--paper:#0e1522;--card:#172136;--ink:#eef2f8;--muted:#9aa7bf;--line:#2a3752;--red:#ff5a67;--blue:#6aa3ff;--wa:#35c46f;--chip:#1f2c46}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 36px}
.postcard{padding:9px;border-radius:6px;background:repeating-linear-gradient(135deg,var(--red) 0 14px,var(--card) 14px 23px,var(--blue) 23px 37px,var(--card) 37px 46px)}
.postcard img{display:block;width:100%;max-width:100%;height:auto;border-radius:3px;border:6px solid var(--card)}
h1{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:clamp(1.7rem,6.5vw,2.3rem);line-height:1.1;margin:20px 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 18px}
.opts{display:grid;gap:10px;margin-bottom:18px}
.opt{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;font-weight:700;font-size:1.05rem}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .l{width:30px;height:30px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;flex:none}
.opt:has(input:checked){border-color:var(--blue)}
.opt:has(input:checked) .l{background:var(--blue);color:#fff}
.opt:has(input:focus-visible){outline:3px solid var(--blue);outline-offset:2px}
label.f{display:block;font-weight:700;margin-bottom:6px}
input[type=text]{width:100%;font:inherit;font-size:1rem;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--blue)}
.btn{display:block;width:100%;margin-top:16px;font:inherit;font-weight:700;font-size:1.05rem;padding:14px;border:0;border-radius:12px;background:var(--blue);color:#fff;cursor:pointer;text-align:center;text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}
.btn.wa{background:var(--wa)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.err{color:var(--red);font-size:.9rem;min-height:1.4em;margin-top:8px}
.done{display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:4px}
.done h2{font-family:'Bricolage Grotesque',sans-serif;margin:0 0 4px;font-size:1.4rem}
.done p{margin:0;color:var(--muted)}
.burst{font-size:3rem;line-height:1;margin-bottom:8px}
.sign{margin-top:14px!important;color:var(--ink)!important}
.done{text-align:center}
.link{background:none;border:0;color:var(--blue);font:inherit;text-decoration:underline;cursor:pointer;padding:0;margin-top:12px}
</style>
</head>

  <h1>Which city in Vietnam is this?</h1>
  <p class="sub">Pick one answer. No Googling!</p>

  <form id="quiz" novalidate>
    <div class="opts" role="radiogroup" aria-label="Answer options">
      <label class="opt"><input type="radio" name="city" value="Hanoi"><span class="l">A</span>Hanoi</label>
      <label class="opt"><input type="radio" name="city" value="Da Nang"><span class="l">B</span>Da Nang</label>
      <label class="opt"><input type="radio" name="city" value="Ho Chi Minh City"><span class="l">C</span>Ho Chi Minh City</label>
      <label class="opt"><input type="radio" name="city" value="Nha Trang"><span class="l">D</span>Nha Trang</label>
    </div>
    <label class="f" for="name">Your name</label>
    <input type="text" id="name" name="name" autocomplete="name" placeholder="e.g. Priya" maxlength="40">
    <div class="err" id="err" role="alert"></div>
    <button class="btn" type="submit" id="sub">Submit answer</button>
  </form>

  <div class="done" id="done">
    <div class="burst" aria-hidden="true">🎉</div>
    <h2 id="doneTitle"></h2>
    <p>Your answer is locked in 🔒 The big reveal is coming soon in the group. Stay tuned! 👀</p>
    <p class="sign">Thanks,<br><b>Shreyas</b></p>
  </div>
</div>
<script>
/* ===== PASTE YOUR FORMSPREE ENDPOINT BETWEEN THE QUOTES ===== */
const ENDPOINT='https://formspree.io/f/XXXXXXXX';
/* ============================================================ */
const f=document.getElementById('quiz'),done=document.getElementById('done'),err=document.getElementById('err');
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9';document.body.appendChild(c);
  const x=c.getContext('2d'),W=c.width=innerWidth*devicePixelRatio,H=c.height=innerHeight*devicePixelRatio;
  const cols=['#d62839','#1d4e89','#ffd166','#1faa59','#f4a261','#9b5de5'];
  const ps=Array.from({length:160},()=>({x:W/2,y:H*0.35,vx:(Math.random()-.5)*28*devicePixelRatio,vy:(-Math.random()*22-6)*devicePixelRatio,s:(5+Math.random()*6)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*6)]}));
  let t=0;(function f(){t++;x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=0.6*devicePixelRatio;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});
    if(t<150)requestAnimationFrame(f);else c.remove();})();
}
f.addEventListener('submit',async e=>{
  e.preventDefault();
  const pick=f.querySelector('input[name=city]:checked'),name=document.getElementById('name').value.trim();
  if(!pick){err.textContent='Pick one of the four cities first.';return;}
  if(!name){err.textContent='Add your name so your answer can be counted.';return;}
  err.textContent='';
  const btn=document.getElementById('sub');btn.disabled=true;btn.textContent='Locking in…';
  try{
    const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
      body:JSON.stringify({name:name,city:pick.value,answered_at:new Date().toLocaleString()})});
    if(!r.ok)throw new Error(r.status);
  }catch(x){err.textContent='Couldn’t submit. Check your internet and tap Submit again.';btn.disabled=false;btn.textContent='Submit answer';return;}
  document.getElementById('doneTitle').textContent=`Awesome, ${name}! 🙌`;
  f.style.display='none';done.style.display='block';done.scrollIntoView({behavior:'smooth',block:'center'});confetti();
});
</script>
